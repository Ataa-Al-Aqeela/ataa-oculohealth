<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ataa OculoHealth - نظام التحليل الطبي الشبكي</title>

    <!-- 1. إصلاح الـ Open Graph (لمعاينة الرابط بشكل صحيح على واتساب وتليجرام) -->
    <meta property="og:title" content="Ataa OculoHealth - نظام التحليل الطبي الشبكي" />
    <meta property="og:description" content="منصة متقدمة للتحليل الطبي والتشخيص البصري الذكي لشبكية العين." />
    <meta property="og:image" content="https://ataa-oculohealth.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://ataa-oculohealth.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ataa OculoHealth" />
    <meta name="twitter:description" content="نظام التحليل الطبي التشخيصي الشبكي." />
    <meta name="twitter:image" content="https://ataa-oculohealth.vercel.app/og-image.jpg" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 { color: #1a568c; text-align: center; }
        .upload-area {
            border: 2px dashed #007bff;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            background: #f8fbff;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ataa OculoHealth</h1>
    <p style="text-align: center;">نظام التحليل الطبي والتشخيص البصري الذكي لشبكية العين</p>

    <!-- منطقة رفع الصور -->
    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        <h3>انقر هنا أو اسحب الصورة للرفع</h3>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleNewImage(event)">
    </div>

    <!-- عرض نتائج التحليل -->
    <div id="reportContainer" class="result-box" style="display:none;">
        <h2 id="reportTitle">تقرير التشخيص الطبي المفصل</h2>
        <div id="reportContent"></div>

        <!-- 2. إصلاح زر الواتساب ليشتغل على العادي والأعمال بدون مشاكل -->
        <button class="btn-whatsapp" onclick="shareToWhatsApp()">
            مشاركة التقرير عبر واتساب
        </button>
    </div>
</div>

<script>
    // 3. تعليمات الذكاء الاصطناعي (Prompt) للتحليل الدقيق والترجمة الكاملة
    const SYSTEM_PROMPT = 
    أنت مساعد طبي متخصص في تحليل صور قعر العين (Fundus/Retina images).
    قواعد عملية التحليل:
    1. قم بتحليل الصورة الحالية المرفقة بشكل مستقل تماماً وبدقة متناهية وصريحة بدون الاعتماد على أي تشخيص سابق.
    2. يجب ترجمة كافة محتويات الواجهة والتقرير إلى اللغة العربية بشكل كامل 100% (العناوين الرئيسية، المصطلحات، والموجودات السريرية).
    3. الهيكل المطلوب للتقرير:
       - التشخيص الأولي الرئيسي (Primary Diagnosis)
       - أبرز الموجودات السريرية والبصرية (Key Clinical Findings)
       - المؤشرات الحيوية التنبؤية المتقدمة لشبكية العين (Advanced Predictive Oculomics Biomarkers)
    ;
  function handleNewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 4. تصفير الذاكرة والنتائج السابقة تماماً
        resetAnalysisState();

        // إظهار واجهة التحميل
        document.getElementById('reportContainer').style.display = 'block';
        document.getElementById('reportContent').innerHTML = '<p>جاري تحليل الصورة الحالية بدقة متناهية...</p>';

        // تنفيذ طلب التحليل الجديد
        analyzeImageWithAI(file);
    }

    function resetAnalysisState() {
        document.getElementById('reportContent').innerHTML = '';
    }

    function analyzeImageWithAI(imageFile) {
        /*
          هنا يتم ربط ملف الصورة مع API الذكاء الاصطناعي الخاص بك مع إرسال SYSTEM_PROMPT.
          عند استقبال النتيجة، يتم عرض التقرير المترجم كاملاً.
        */
        
        // محاكاة استلام النتيجة المترجمة بالكامل
        setTimeout(() => {
            document.getElementById('reportContent').innerHTML = 
                <div style="background-color: #fff5f5; padding: 15px; border-radius: 6px; border-right: 4px solid #e53e3e;">
                    <h3 style="margin:0; color:#c53030;">التشخيص الأولي الرئيسي:</h3>
                    <p style="font-weight:bold; font-size: 18px;">بقع قطنية ونزف بالشبكية (Cotton Wool Spots & Hemorrhages)</p>
                </div>
                <h4>أبرز الموجودات السريرية والبصرية:</h4>
                <ul>
                    <li>وجود بؤر نضحية بيضاء/صفراء متفرقة في الشبكية.</li>
                    <li>تغيرات ونزف مبعثر في الأوعية الدموية الدقيقة.</li>
                </ul>
                <h4>المؤشرات الحيوية التنبؤية المتقدمة:</h4>
                <p>تظهر المعطيات انسداداً بالأوعية الدقيقة يتطلب متابعة اعتلال الشبكية والفحوصات التأكيدية.</p>
            ;
        }, 1500);
    }

    // 5. دالة مشاركة الواتساب المعدلة لتفادي خطأ WhatsApp Business
    function shareToWhatsApp() {
        const pageUrl = window.location.href;
        const text = "تقرير التحليل الطبي لشبكية العين - Ataa OculoHealth:";
        const fullMessage = encodeURIComponent(${text}\n${pageUrl});
        
        // استخدام API الشامل يعمل على الواتساب العادي والأعمال معاً
        window.open(https://api.whatsapp.com/send?text=${fullMessage}, '_blank');
    }
</script>

</body>
</html>
